<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login Ubicaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Test de Carga de Ubicaciones</h3>
                    </div>
                    <div class="card-body">
                        <div id="alert-container"></div>
                        
                        <!-- Departamento -->
                        <div class="mb-3">
                            <label for="departamento" class="form-label">Departamento</label>
                            <select class="form-select" id="departamento">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        
                        <!-- Municipio -->
                        <div class="mb-3">
                            <label for="municipio" class="form-label">Municipio</label>
                            <select class="form-select" id="municipio" disabled>
                                <option value="">Seleccione departamento primero</option>
                            </select>
                        </div>
                        
                        <!-- Zona -->
                        <div class="mb-3">
                            <label for="zona" class="form-label">Zona</label>
                            <select class="form-select" id="zona" disabled>
                                <option value="">Seleccione municipio primero</option>
                            </select>
                        </div>
                        
                        <!-- Puesto -->
                        <div class="mb-3">
                            <label for="puesto" class="form-label">Puesto</label>
                            <select class="form-select" id="puesto" disabled>
                                <option value="">Seleccione zona primero</option>
                            </select>
                        </div>
                        
                        <div class="mt-3">
                            <h5>Log de Eventos:</h5>
                            <div id="log" class="border p-3" style="height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Función para agregar logs
        function addLog(message) {
            const log = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            log.innerHTML += `[${timestamp}] ${message}\n`;
            log.scrollTop = log.scrollHeight;
        }

        // Función para mostrar alertas
        function showAlert(message, type = 'info') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Cargar departamentos
        async function loadDepartamentos() {
            try {
                addLog('🔄 Cargando departamentos...');
                
                const response = await fetch('/api/locations/departamentos');
                const data = await response.json();
                
                addLog(`📡 Response status: ${response.status}`);
                addLog(`📊 Response data: ${JSON.stringify(data)}`);
                
                if (data.success && data.data) {
                    const select = document.getElementById('departamento');
                    select.innerHTML = '<option value="">Seleccione departamento</option>';
                    
                    data.data.forEach(dept => {
                        const option = document.createElement('option');
                        option.value = dept.departamento_codigo;
                        option.textContent = dept.departamento_nombre;
                        select.appendChild(option);
                    });
                    
                    addLog(`✅ ${data.data.length} departamentos cargados`);
                    showAlert(`✅ ${data.data.length} departamentos cargados correctamente`, 'success');
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`);
                showAlert(`❌ Error cargando departamentos: ${error.message}`, 'danger');
            }
        }

        // Cargar municipios
        async function loadMunicipios(departamentoCodigo) {
            try {
                addLog(`🔄 Cargando municipios para departamento: ${departamentoCodigo}`);
                
                const response = await fetch(`/api/locations/municipios/${departamentoCodigo}`);
                const data = await response.json();
                
                addLog(`📡 Response status: ${response.status}`);
                addLog(`📊 Response data: ${JSON.stringify(data).substring(0, 200)}...`);
                
                if (data.success && data.data) {
                    const select = document.getElementById('municipio');
                    select.innerHTML = '<option value="">Seleccione municipio</option>';
                    select.disabled = false;
                    
                    data.data.forEach(mun => {
                        const option = document.createElement('option');
                        option.value = mun.municipio_codigo;
                        option.textContent = mun.municipio_nombre;
                        select.appendChild(option);
                    });
                    
                    addLog(`✅ ${data.data.length} municipios cargados`);
                    showAlert(`✅ ${data.data.length} municipios cargados correctamente`, 'success');
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`);
                showAlert(`❌ Error cargando municipios: ${error.message}`, 'danger');
            }
        }

        // Cargar zonas
        async function loadZonas(municipioCodigo) {
            try {
                addLog(`🔄 Cargando zonas para municipio: ${municipioCodigo}`);
                
                const response = await fetch(`/api/locations/zonas/${municipioCodigo}`);
                const data = await response.json();
                
                addLog(`📡 Response status: ${response.status}`);
                addLog(`📊 Response data: ${JSON.stringify(data).substring(0, 200)}...`);
                
                if (data.success && data.data) {
                    const select = document.getElementById('zona');
                    select.innerHTML = '<option value="">Seleccione zona</option>';
                    select.disabled = false;
                    
                    data.data.forEach(zona => {
                        const option = document.createElement('option');
                        option.value = zona.zona_codigo;
                        option.textContent = zona.zona_nombre;
                        select.appendChild(option);
                    });
                    
                    addLog(`✅ ${data.data.length} zonas cargadas`);
                    showAlert(`✅ ${data.data.length} zonas cargadas correctamente`, 'success');
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`);
                showAlert(`❌ Error cargando zonas: ${error.message}`, 'danger');
            }
        }

        // Cargar puestos
        async function loadPuestos(zonaCodigo) {
            try {
                addLog(`🔄 Cargando puestos para zona: ${zonaCodigo}`);
                
                const response = await fetch(`/api/locations/puestos/${zonaCodigo}`);
                const data = await response.json();
                
                addLog(`📡 Response status: ${response.status}`);
                addLog(`📊 Response data: ${JSON.stringify(data).substring(0, 200)}...`);
                
                if (data.success && data.data) {
                    const select = document.getElementById('puesto');
                    select.innerHTML = '<option value="">Seleccione puesto</option>';
                    select.disabled = false;
                    
                    data.data.forEach(puesto => {
                        const option = document.createElement('option');
                        option.value = puesto.puesto_codigo;
                        option.textContent = puesto.puesto_nombre;
                        select.appendChild(option);
                    });
                    
                    addLog(`✅ ${data.data.length} puestos cargados`);
                    showAlert(`✅ ${data.data.length} puestos cargados correctamente`, 'success');
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`);
                showAlert(`❌ Error cargando puestos: ${error.message}`, 'danger');
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            addLog('🚀 Iniciando test de ubicaciones...');
            loadDepartamentos();
            
            // Departamento change
            document.getElementById('departamento').addEventListener('change', function() {
                const departamentoCodigo = this.value;
                
                // Reset selects
                const municipioSelect = document.getElementById('municipio');
                const zonaSelect = document.getElementById('zona');
                const puestoSelect = document.getElementById('puesto');
                
                municipioSelect.innerHTML = '<option value="">Seleccione municipio</option>';
                municipioSelect.disabled = !departamentoCodigo;
                
                zonaSelect.innerHTML = '<option value="">Seleccione zona</option>';
                zonaSelect.disabled = true;
                
                puestoSelect.innerHTML = '<option value="">Seleccione puesto</option>';
                puestoSelect.disabled = true;
                
                if (departamentoCodigo) {
                    loadMunicipios(departamentoCodigo);
                }
            });
            
            // Municipio change
            document.getElementById('municipio').addEventListener('change', function() {
                const municipioCodigo = this.value;
                
                // Reset selects
                const zonaSelect = document.getElementById('zona');
                const puestoSelect = document.getElementById('puesto');
                
                zonaSelect.innerHTML = '<option value="">Seleccione zona</option>';
                zonaSelect.disabled = !municipioCodigo;
                
                puestoSelect.innerHTML = '<option value="">Seleccione puesto</option>';
                puestoSelect.disabled = true;
                
                if (municipioCodigo) {
                    loadZonas(municipioCodigo);
                }
            });
            
            // Zona change
            document.getElementById('zona').addEventListener('change', function() {
                const zonaCodigo = this.value;
                
                // Reset puesto
                const puestoSelect = document.getElementById('puesto');
                
                puestoSelect.innerHTML = '<option value="">Seleccione puesto</option>';
                puestoSelect.disabled = !zonaCodigo;
                
                if (zonaCodigo) {
                    loadPuestos(zonaCodigo);
                }
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
